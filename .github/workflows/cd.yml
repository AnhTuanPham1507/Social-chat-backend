# Comprehensive CD Pipeline for Social Chat Backend
# Handles automated deployment to staging and production environments

name: 🚀 Continuous Deployment

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile'
      - 'docker-compose*.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy (default: latest from main)'
        required: false
        type: string
      skip_tests:
        description: 'Skip smoke tests'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deployment without approval'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22.16.0'

jobs:
  # Job 1: Prepare deployment
  prepare:
    name: 📋 Prepare Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      image-tag: ${{ steps.determine-tag.outputs.image-tag }}
      environment: ${{ steps.determine-env.outputs.environment }}
      deploy-staging: ${{ steps.determine-env.outputs.deploy-staging }}
      deploy-production: ${{ steps.determine-env.outputs.deploy-production }}

    steps:
      - name: 🎯 Determine target environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "deploy-staging=${{ inputs.environment == 'staging' }}" >> $GITHUB_OUTPUT
            echo "deploy-production=${{ inputs.environment == 'production' }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "deploy-staging=true" >> $GITHUB_OUTPUT
            echo "deploy-production=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Determine image tag
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "image-tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Deployment summary
        run: |
          echo "## 🚀 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ steps.determine-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ steps.determine-tag.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # Job 2: Deploy to Staging
  deploy-staging:
    name: 🔄 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare
    if: needs.prepare.outputs.deploy-staging == 'true'
    environment:
      name: staging
      url: https://staging-api.social-chat.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure deployment credentials
        run: |
          echo "Setting up deployment credentials for staging..."
          # In a real scenario, you would configure SSH keys, cloud credentials, etc.

      - name: 🐳 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image-tag }}"
          
          # Simulate deployment process
          # In reality, this would be something like:
          # ./scripts/deploy.sh -e staging -i ${{ needs.prepare.outputs.image-tag }} -f
          
          echo "✅ Staging deployment completed"
        env:
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}

      - name: ⏳ Wait for deployment
        run: |
          echo "Waiting for staging deployment to stabilize..."
          sleep 30

      - name: 🏥 Health check
        run: |
          echo "Performing health check on staging..."
          
          # Simulate health check
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts"
            
            # In reality, this would be:
            # if curl -f https://staging-api.social-chat.com/health; then
            if [ $attempt -eq 3 ]; then
              echo "✅ Staging health check passed!"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Staging health check failed after $max_attempts attempts"
              exit 1
            fi
            
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: 🧪 Run smoke tests
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "Running smoke tests on staging..."
          
          # Simulate smoke tests
          echo "✅ Basic API endpoints responding"
          echo "✅ Database connectivity verified"
          echo "✅ Authentication flow working"
          echo "✅ File upload functionality working"
          
          echo "✅ All smoke tests passed!"

      - name: 📊 Staging deployment summary
        run: |
          echo "## 🎉 Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ needs.prepare.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://staging-api.social-chat.com" >> $GITHUB_STEP_SUMMARY

  # Job 3: Production deployment approval
  production-approval:
    name: 🎯 Production Approval
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours
    needs: [prepare, deploy-staging]
    if: |
      always() && 
      needs.prepare.outputs.deploy-production == 'true' ||
      (needs.deploy-staging.result == 'success' && github.ref == 'refs/heads/main')
    environment:
      name: production-approval

    steps:
      - name: 🎯 Request production deployment approval
        run: |
          echo "## 🎯 Production Deployment Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "Deployment to production requires manual approval." >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.prepare.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "**Staging Status:** ✅ Successfully deployed and tested" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Staging Status:** ⚠️ Not deployed to staging" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 4: Deploy to Production
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, production-approval]
    if: always() && needs.production-approval.result == 'success'
    environment:
      name: production
      url: https://api.social-chat.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure production credentials
        run: |
          echo "Setting up production deployment credentials..."
          # Configure production-specific credentials

      - name: 📊 Pre-deployment backup
        run: |
          echo "Creating production backup..."
          # In reality, trigger database backup
          echo "✅ Backup completed"

      - name: 🐳 Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image-tag }}"
          
          # Simulate blue-green deployment
          echo "🔄 Starting blue-green deployment..."
          echo "🟦 Deploying to blue environment..."
          echo "🔍 Running health checks on blue environment..."
          echo "🔀 Switching traffic to blue environment..."
          echo "🟩 Decommissioning green environment..."
          
          echo "✅ Production deployment completed"
        env:
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}

      - name: ⏳ Post-deployment stabilization
        run: |
          echo "Waiting for production deployment to stabilize..."
          sleep 60

      - name: 🏥 Production health check
        run: |
          echo "Performing comprehensive health check on production..."
          
          max_attempts=15
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Production health check attempt $attempt/$max_attempts"
            
            # Simulate comprehensive health checks
            if [ $attempt -eq 5 ]; then
              echo "✅ Production health check passed!"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Production health check failed!"
              echo "🔄 Initiating rollback..."
              # Trigger rollback process
              exit 1
            fi
            
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: 📈 Post-deployment monitoring
        run: |
          echo "Setting up post-deployment monitoring..."
          echo "✅ Error rate monitoring active"
          echo "✅ Response time monitoring active"
          echo "✅ Resource utilization monitoring active"

      - name: 🎉 Production deployment summary
        run: |
          echo "## 🎉 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ needs.prepare.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Monitoring:** ✅ Active" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://api.social-chat.com" >> $GITHUB_STEP_SUMMARY

  # Job 5: Post-deployment notifications
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: 📢 Send deployment notifications
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          fi
          
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Production deployment successful"
          fi
          
          if [ "${{ needs.deploy-production.result }}" == "failure" ]; then
            echo "❌ Production deployment failed"
          fi
          
          # In reality, send notifications to:
          # - Slack channels
          # - Discord webhooks
          # - Email notifications
          # - PagerDuty alerts (for failures)

      - name: 📊 Final deployment summary
        run: |
          echo "## 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging:** ${{ needs.deploy-staging.result == 'success' && '✅ Success' || needs.deploy-staging.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production:** ${{ needs.deploy-production.result == 'success' && '✅ Success' || needs.deploy-production.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ needs.prepare.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completion Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
