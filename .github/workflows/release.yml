# Release Management Pipeline for Social Chat Backend
# Handles semantic versioning, changelog generation, and release creation

name: 🏷️ Release Management

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      prerelease:
        description: 'Create as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Determine if release is needed
  check-release:
    name: 🔍 Check Release Need
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      changelog: ${{ steps.check.outputs.changelog }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Check for release necessity
        id: check
        run: |
          # Check if this is a manual release
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Manual release triggered" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Check for conventional commits that warrant a release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "No previous tags found, creating initial release" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Check commits since last tag for release-worthy changes
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --oneline)
          
          if echo "$COMMITS_SINCE_TAG" | grep -E "^[a-f0-9]+ (feat|fix|BREAKING CHANGE)"; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Release-worthy changes found since last tag" >> $GITHUB_STEP_SUMMARY
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "No release-worthy changes found" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Generate version and changelog
  generate-release:
    name: 📝 Generate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏷️ Determine version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RELEASE_TYPE="${{ inputs.release_type }}"
          else
            # Auto-determine release type based on conventional commits
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --oneline)
            
            if echo "$COMMITS_SINCE_TAG" | grep -q "BREAKING CHANGE"; then
              RELEASE_TYPE="major"
            elif echo "$COMMITS_SINCE_TAG" | grep -q "^[a-f0-9]+ feat"; then
              RELEASE_TYPE="minor"
            else
              RELEASE_TYPE="patch"
            fi
          fi
          
          # Calculate new version
          case $RELEASE_TYPE in
            major)
              NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print ($1+1)".0.0"}')
              ;;
            minor)
              NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."($2+1)".0"}')
              ;;
            patch)
              NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."$2"."($3+1)}')
              ;;
            prerelease)
              NEW_VERSION="${CURRENT_VERSION}-rc.$(date +%Y%m%d%H%M%S)"
              ;;
          esac
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          
          echo "## 🏷️ Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Current Version:** $CURRENT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Type:** $RELEASE_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** $NEW_VERSION" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LAST_TAG}..HEAD"
          fi
          
          # Generate changelog from conventional commits
          CHANGELOG="## Changes in v${{ steps.version.outputs.version }}\n\n"
          
          # Features
          FEATURES=$(git log $COMMIT_RANGE --oneline | grep "^[a-f0-9]* feat" | sed 's/^[a-f0-9]* feat[(:]*[^)]*[)]*: */- /' || true)
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### ✨ Features\n${FEATURES}\n\n"
          fi
          
          # Bug fixes
          FIXES=$(git log $COMMIT_RANGE --oneline | grep "^[a-f0-9]* fix" | sed 's/^[a-f0-9]* fix[(:]*[^)]*[)]*: */- /' || true)
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi
          
          # Breaking changes
          BREAKING=$(git log $COMMIT_RANGE --oneline | grep "BREAKING CHANGE" || true)
          if [ -n "$BREAKING" ]; then
            CHANGELOG="${CHANGELOG}### 💥 Breaking Changes\n${BREAKING}\n\n"
          fi
          
          # Other changes
          OTHERS=$(git log $COMMIT_RANGE --oneline | grep -v "^[a-f0-9]* \(feat\|fix\)" | head -10 | sed 's/^[a-f0-9]* /- /' || true)
          if [ -n "$OTHERS" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 Other Changes\n${OTHERS}\n\n"
          fi
          
          # Save changelog
          echo -e "$CHANGELOG" > RELEASE_CHANGELOG.md
          
          # Set output (escape newlines for GitHub Actions)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📄 Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || true

      - name: 💾 Upload changelog artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.md

  # Job 3: Build release artifacts
  build-release:
    name: 🏗️ Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-release, generate-release]
    if: needs.check-release.outputs.should-release == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        run: yarn build

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.generate-release.outputs.version }}
            type=raw,value=latest

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Job 4: Create GitHub release
  create-release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [generate-release, build-release]
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Download changelog
        uses: actions/download-artifact@v3
        with:
          name: release-changelog

      - name: 🏷️ Create Git tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a ${{ needs.generate-release.outputs.tag }} -m "Release ${{ needs.generate-release.outputs.tag }}"
          git push origin ${{ needs.generate-release.outputs.tag }}

      - name: 🎉 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.generate-release.outputs.tag }}
          release_name: Release ${{ needs.generate-release.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          draft: false
          prerelease: ${{ inputs.prerelease || false }}

      - name: 📊 Release summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.generate-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.generate-release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.generate-release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

  # Job 5: Deploy release (optional)
  deploy-release:
    name: 🚀 Deploy Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [generate-release, create-release]
    if: ${{ !inputs.prerelease }}
    environment:
      name: production
      url: https://api.social-chat.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger production deployment
        uses: ./.github/workflows/cd.yml
        with:
          environment: production
          image_tag: ${{ needs.generate-release.outputs.version }}
          force_deploy: true

      - name: 📊 Deployment summary
        run: |
          echo "## 🚀 Production Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.generate-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY 