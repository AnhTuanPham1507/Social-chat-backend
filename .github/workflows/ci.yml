# Comprehensive CI Pipeline for Social Chat Backend
# Performs code quality checks, testing, security scanning, and build verification

name: 🔄 Continuous Integration

on:
    pull_request:
        branches: ['main', 'develop']
        paths:
            - 'src/**'
            - 'test/**'
            - 'package.json'
            - 'yarn.lock'
            - 'tsconfig*.json'
            - '.eslintrc.js'
            - 'Dockerfile'
            - 'docker-compose*.yml'

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22.16.0'
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # Job 1: Code Quality and Linting
    code-quality:
        name: 🔍 Code Quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile --prefer-offline

            - name: 🔍 Run ESLint
              run: yarn lint
              continue-on-error: true

            - name: 🎨 Check code formatting
              run: yarn prettier --check .

            # - name: 🔍 Run SonarQube Scanner
            #   uses: SonarSource/sonarqube-scan-action@v5
            #   env:
            #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Job 2: Security Scanning
    security:
        name: 🔒 Security Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
          contents: write
          security-events: write
        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}


            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🛡️ Audit
              run: |
                  yarn audit --level moderate --json > audit-results.json || true
                  echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
                  if [ -s audit-results.json ]; then
                    echo "⚠️ Vulnerabilities found. Check the full report in the job logs." >> $GITHUB_STEP_SUMMARY
                  else
                    echo "✅ No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
                  fi

            - name: 🔍 Initialize CodeQL
              uses: github/codeql-action/init@v2
              with:
                  languages: javascript
                  queries: security-and-quality

            - name: 🔍 Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v2
    
    # Job 3: Unit Tests
    test-unit:
        name: 🧪 Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🧪 Run unit tests
              run: yarn test:unit --coverage --passWithNoTests
              env:
                  CI: true

            - name: 📊 Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  file: ./test/coverage/lcov.info
                  flags: unit
                  name: unit-tests

            - name: 📋 Generate test summary
              if: always()
              run: |
                  echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY

    # Job 4: Integration Tests
    test-integration:
        name: 🔗 Integration Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:15.4-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: social-chat-test-db
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            redis:
                image: redis:7.2.5-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🔗 Run integration tests
              run: yarn test:e2e --passWithNoTests
              env:
                  CI: true

            - name: 📋 Generate test summary
              if: always()
              run: |
                  echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY
