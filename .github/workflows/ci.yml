# Comprehensive CI Pipeline for Social Chat Backend
# Performs code quality checks, testing, security scanning, and build verification

name: 🔄 Continuous Integration

on:
    pull_request:
        branches: ['main', 'develop']
        paths:
            - 'src/**'
            - 'test/**'
            - 'package.json'
            - 'yarn.lock'
            - 'tsconfig*.json'
            - '.eslintrc.js'
            - 'Dockerfile'
            - 'docker-compose*.yml'
            
permissions:
  contents: read
  security-events: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22.16.0'
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # Job 1: Code Quality and Linting
    code-quality:
        name: 🔍 Code Quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile --prefer-offline

            - name: 🔍 Run ESLint
              run: yarn lint
              continue-on-error: true

            - name: 🎨 Check code formatting
              run: yarn prettier --check .

            - name: 🔍 Run SonarQube Scanner
              uses: SonarSource/sonarqube-scan-action@v5
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Job 2: Security Scanning
    security:
        name: 🔒 Security Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            security-events: write

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}


            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🛡️ Audit
              run: |
                  yarn audit --level moderate --json > audit-results.json || true
                  echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
                  if [ -s audit-results.json ]; then
                    echo "⚠️ Vulnerabilities found. Check the full report in the job logs." >> $GITHUB_STEP_SUMMARY
                  else
                    echo "✅ No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
                  fi

            - name: 🔍 Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: javascript
                  queries: security-and-quality

            - name: 🔍 Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                github-token: ${{ secrets.GH_PAT }}
    


    # Job 3: Unit Tests
    test-unit:
        name: 🧪 Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🧪 Run unit tests
              run: yarn test:unit --coverage --passWithNoTests
              env:
                  CI: true

            - name: 📊 Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  file: ./test/coverage/lcov.info
                  flags: unit
                  name: unit-tests

            - name: 📋 Generate test summary
              if: always()
              run: |
                  echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY

    # Job 4: Integration Tests
    test-integration:
        name: 🔗 Integration Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:15.4-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: social-chat-test-db
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            redis:
                image: redis:7.2.5-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🔗 Run integration tests
              run: yarn test:e2e --passWithNoTests
              env:
                  CI: true
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social-chat-test-db
                  REDIS_URL: redis://localhost:6379

            - name: 📋 Generate test summary
              if: always()
              run: |
                  echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY

    # Job 5: Build and Docker
    build:
        name: 🏗️ Build & Docker
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [code-quality]
        permissions:
            contents: read
            packages: write

        outputs:
            image-digest: ${{ steps.build.outputs.digest }}
            image-tag: ${{ steps.meta.outputs.tags }}

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: 📦 Install dependencies
              run: yarn install --frozen-lockfile

            - name: 🏗️ Build application
              run: yarn build

            - name: 📋 Verify build output
              run: |
                  ls -la dist/
                  echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY

            - name: 🔧 Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: 🔐 Log in to Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🏷️ Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: 🐳 Build Docker image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

            - name: 🔍 Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  format: 'sarif'
                  output: 'trivy-results.sarif'

            - name: 📊 Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@v2
              if: always()
              with:
                  sarif_file: 'trivy-results.sarif'

    # Job 6: Deployment Readiness Check
    deployment-check:
        name: 🚀 Deployment Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [test-unit, test-integration, build, security]
        if: github.ref == 'refs/heads/main'

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_PAT }}

            - name: ✅ All checks passed
              run: |
                  echo "## 🎉 All CI Checks Passed!" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Code quality checks" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Security scanning" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Unit tests" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Integration tests" >> $GITHUB_STEP_SUMMARY
                  echo "- ✅ Docker build" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "🚀 Ready for deployment!" >> $GITHUB_STEP_SUMMARY

            - name: 🔔 Notify deployment readiness
              if: success()
              run: echo "::notice title=Deployment Ready::All CI checks passed successfully. Ready for CD pipeline."
