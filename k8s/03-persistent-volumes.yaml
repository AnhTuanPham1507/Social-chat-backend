# =================================================================
# STORAGE CONCEPTS FOR BEGINNERS
# =================================================================
# 
# 1. PersistentVolume (PV):
#    - Cluster-level resource that provides storage
#    - Independent of pod lifecycle
#    - Can be provisioned statically (like above) or dynamically
#
# 2. PersistentVolumeClaim (PVC):
#    - Request for storage by a pod
#    - Specifies size and access modes needed
#    - Binds to a suitable PV
#
# 3. StorageClass:
#    - Defines "classes" of storage (e.g., SSD, HDD)
#    - "manual" means we're manually creating PVs
#    - In production, use dynamic provisioning
#
# 4. Access Modes:
#    - ReadWriteOnce (RWO): Mount by single node
#    - ReadOnlyMany (ROX): Mount read-only by many nodes
#    - ReadWriteMany (RWX): Mount read-write by many nodes
#
# 5. Reclaim Policy:
#    - Retain: Keep data when PVC is deleted
#    - Delete: Delete PV when PVC is deleted
#    - Recycle: Scrub data and make available for reuse
#
# PRODUCTION NOTE:
# - Use cloud provider storage classes (AWS EBS, GCP Persistent Disk)
# - Don't use hostPath in production
# - Consider backup strategies for persistent data
# ================================================================= 