# =================================================================
# PERSISTENT STORAGE CONFIGURATION
# =================================================================
# PersistentVolumes (PV) provide storage resources in the cluster
# PersistentVolumeClaims (PVC) are requests for storage by pods
# This ensures data persistence across pod restarts
# =================================================================

# PostgreSQL Data Storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
    type: local
  annotations:
    tutorial: "PersistentVolume provides the actual storage space"
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi  # 1 Gigabyte for PostgreSQL data
  accessModes:
    - ReadWriteOnce  # Can be mounted by only one node at a time
  hostPath:
    path: "/tmp/k8s-data/postgres"  # Local storage (for development only)
  persistentVolumeReclaimPolicy: Retain  # Keep data when PVC is deleted

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: social-chat
  labels:
    app: postgres
  annotations:
    tutorial: "PVC is a request for storage that will bind to the PV above"
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

