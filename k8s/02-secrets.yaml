# =================================================================
# SECRETS CONFIGURATION
# =================================================================
# Secrets store sensitive data like passwords, API keys, tokens
# Data is base64 encoded (NOT encrypted) - use external secret management in production
# =================================================================

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: social-chat
  labels:
    app: social-chat-backend
    component: secrets
  annotations:
    description: "Sensitive configuration for Social Chat Backend"
    tutorial: "Secrets store sensitive data - they are base64 encoded"
type: Opaque
data:
  # JWT Secret (base64 encoded: ABC123@#$%^&*)
  JWT_SECRET: QUJDMTIzQCMkJV4mKg==
  
  # Database Password (base64 encoded: postgres)
  DB_PASSWORD: cG9zdGdyZXM=
  
  # Google OAuth Secret (base64 encoded: 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)
  GOOGLE_CLIENT_SECRET: R09DU1BYLV9HLWJkOHZ2MTJXbUIwUXJ3cV9uUmJyc09vLU8=
  
  # MinIO Credentials
  # Access Key (base64 encoded: AEn67IYXslXqENHzQxCN)
  MINIO_ACCESS_KEY: QUVuNjdJWVhzbFhxRU5IelF4Q04=
  
  # Secret Key (base64 encoded: ErdGLLcruDPK6nFatGw2IdZb4xBrdHlAbEzGNq4T)
  MINIO_SECRET_KEY: RXJkR0xMY3J1RFBLNG5GYXRHV1RJZFpiNHhCcmRIbEFiRXpHTnE0VA==
  
  # Redis Password (base64 encoded: ewqovxnzsa2438JFGSJFGbsad7dsa76asjj)
  REDIS_PASSWORD: ZXdxb3Z4bnpzYTI0MzhKRkdTSkZHYnNhZDdkc2E3NmFzamo=

---
# =================================================================
# HOW TO ENCODE/DECODE SECRETS (FOR LEARNING)
# =================================================================
# To encode a value to base64:
#   echo -n "your-secret-value" | base64
#
# To decode a base64 value:
#   echo "base64-encoded-value" | base64 -d
#
# Example:
#   echo -n "postgres" | base64
#   # Output: cG9zdGdyZXM=
#
# SECURITY NOTE: In production, use tools like:
# - Kubernetes External Secrets Operator
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# ================================================================= 