# =================================================================
# MINIO OBJECT STORAGE CONFIGURATION
# =================================================================
# MinIO provides S3-compatible object storage for file uploads
# =================================================================

# MinIO Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: social-chat
  labels:
    app: minio
    component: object-storage
  annotations:
    description: "MinIO object storage for Social Chat Backend"
    tutorial: "MinIO provides S3-compatible storage for files"
spec:
  replicas: 1  # Single instance for development
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        component: object-storage
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-08-03T04-33-23Z
        ports:
        - containerPort: 9000
          name: api-port
        - containerPort: 9001
          name: console-port
        
        # MinIO server command with console address
        command:
        - minio
        - server
        - /data
        - --console-address
        - ":9001"
        
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MINIO_SECRET_KEY
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc

# MinIO API Service
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: social-chat
  labels:
    app: minio
    component: object-storage
  annotations:
    description: "Service endpoint for MinIO API"
    tutorial: "Internal service for MinIO S3 API access"
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: api
  selector:
    app: minio

# MinIO Console Service (for web UI access)
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console-service
  namespace: social-chat
  labels:
    app: minio
    component: object-storage
  annotations:
    description: "Service endpoint for MinIO Console"
    tutorial: "Web UI for MinIO management (optional)"
spec:
  type: NodePort  # Expose console for external access
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: console
    nodePort: 30001  # Access via localhost:30001
  selector:
    app: minio

# =================================================================
# MINIO CONCEPTS FOR BEGINNERS
# =================================================================
#
# 1. MinIO Architecture:
#    - S3-compatible object storage
#    - API server (port 9000) for programmatic access
#    - Console (port 9001) for web UI management
#    - Bucket-based organization (like folders)
#
# 2. Storage Structure:
#    - Buckets: Top-level containers (like S3 buckets)
#    - Objects: Files stored within buckets
#    - Paths: Hierarchical organization within buckets
#
# 3. Authentication:
#    - Access Key: Like username (MINIO_ROOT_USER)
#    - Secret Key: Like password (MINIO_ROOT_PASSWORD)
#    - Can create additional users with specific permissions
#
# 4. Connection from Application:
#    - Endpoint: http://minio-service:9000
#    - Use AWS SDK or MinIO SDK
#    - Configure client with access/secret keys
#
# 5. Web Console Access:
#    - URL: http://localhost:30001 (after port-forward or NodePort)
#    - Login with root credentials
#    - Create buckets, upload files, manage policies
#
# SETUP STEPS:
# 1. Deploy MinIO
# 2. Access console: kubectl port-forward svc/minio-console-service 9001:9001 -n social-chat
# 3. Login with access/secret keys from secrets
# 4. Create bucket for your application (e.g., "social-chat-assets")
#
# TROUBLESHOOTING COMMANDS:
# - kubectl logs minio-<pod-id> -n social-chat
# - kubectl exec -it minio-<pod-id> -n social-chat -- mc ls /data
# - kubectl port-forward svc/minio-console-service 9001:9001 -n social-chat
# ================================================================= 