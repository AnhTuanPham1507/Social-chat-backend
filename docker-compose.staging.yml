version: '3.9'

services:
    # Application service
    social-chat-backend:
        image: ${DOCKER_REGISTRY}/social-chat-backend:${IMAGE_TAG:-latest}
        container_name: social-chat-backend-staging
        restart: unless-stopped
        environment:
            - NODE_ENV=staging
            - PORT=3000
            - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/social-chat-staging-db
            - REDIS_URL=redis://:ewqovxnzsa2438JFGSJFGbsad7dsa76asjj@cache:6379
            - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_ACCESS_KEY=minioadmin
            - MINIO_SECRET_KEY=minioadmin
            - MINIO_USE_SSL=false
            - JWT_SECRET=${JWT_SECRET:-staging-jwt-secret-change-in-production}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-staging-refresh-secret-change-in-production}
            - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
            - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy
            cache:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            minio:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'node', 'dist/health-check.js']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 512M
                reservations:
                    cpus: '0.5'
                    memory: 256M
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    # PostgreSQL Database
    postgres:
        image: postgres:15.4-alpine
        container_name: postgres-staging
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: social-chat-staging-db
            TZ: 'Asia/Ho_Chi_Minh'
            PGTZ: 'Asia/Ho_Chi_Minh'
        volumes:
            - pg_staging_data:/var/lib/postgresql/data
        ports:
            - '5433:5432' # Different port to avoid conflicts
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U postgres -d social-chat-staging-db',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 128M
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    # Redis Cache
    cache:
        image: redis:7.2.5-alpine
        container_name: redis-staging
        restart: unless-stopped
        ports:
            - '6380:6379' # Different port to avoid conflicts
        command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
        environment:
            - REDIS_PASSWORD=ewqovxnzsa2438JFGSJFGbsad7dsa76asjj
        volumes:
            - cache_staging:/data
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 128M
                reservations:
                    cpus: '0.1'
                    memory: 64M
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '3'

    # RabbitMQ Message Broker
    rabbitmq:
        image: rabbitmq:3.12-management-alpine
        container_name: rabbitmq-staging
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: rabbitmq
            RABBITMQ_DEFAULT_PASS: rabbitmq
            RABBITMQ_MANAGEMENT_LOAD_DEFINITIONS: true
        ports:
            - '5673:5672' # AMQP port - different to avoid conflicts
            - '15673:15672' # Management plugin port - different to avoid conflicts
        volumes:
            - rbmq_staging_data:/var/lib/rabbitmq
        command: >
            sh -c "rabbitmq-plugins enable rabbitmq_management &&
                    rabbitmq-plugins enable rabbitmq_prometheus &&
                    rabbitmq-server"
        healthcheck:
            test: ['CMD', 'rabbitmqctl', 'status']
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 128M
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    # MinIO Object Storage
    minio:
        image: minio/minio:RELEASE.2023-10-25T06-33-25Z
        container_name: minio-staging
        restart: unless-stopped
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        ports:
            - '9001:9000' # MinIO API port - different to avoid conflicts
            - '9002:9001' # MinIO console port - different to avoid conflicts
        volumes:
            - minio_staging_data:/data
        command: server /data --console-address ":9001"
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 128M
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    # Database Admin Tool (Adminer)
    adminer:
        image: adminer:4.8.1
        container_name: adminer-staging
        restart: unless-stopped
        ports:
            - '8081:8080' # Different port to avoid conflicts
        environment:
            - ADMINER_DEFAULT_SERVER=postgres
        depends_on:
            - postgres
        networks:
            - my-network
        deploy:
            resources:
                limits:
                    cpus: '0.1'
                    memory: 64M
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '2'

volumes:
    pg_staging_data:
        driver: local
    cache_staging:
        driver: local
    rbmq_staging_data:
        driver: local
    minio_staging_data:
        driver: local

networks:
    my-network:
        driver: bridge
        name: social-chat-staging_my-network
