version: '3.9'

# =============================================================================
# SOCIAL CHAT PLATFORM - LOCAL DEVELOPMENT INFRASTRUCTURE
# =============================================================================
# Services Architecture (5 microservices):
#   - auth:         OAuth, tokens, sessions
#   - user:         Profiles, friends, blocks
#   - post:         Posts, reactions, comments, feed
#   - message:      Conversations, messages, presence, typing
#   - notification: In-app, push notifications
#
# Infrastructure:
#   - PostgreSQL:    External (localhost:5432) - installed outside Docker
#   - Redis:         Cache, sessions, presence, pub/sub
#   - Kafka:         Event streaming, service communication
#   - Elasticsearch: Search (users, posts, hashtags)
#   - MinIO:         Object storage (images, videos, attachments)
#   - Keycloak:      OAuth2/OIDC identity provider
#   - Kong:          API Gateway
#
# PostgreSQL Setup (run manually before starting):
#   CREATE DATABASE kong;
#   CREATE DATABASE keycloak;
#   CREATE DATABASE "social-chat-local";
# =============================================================================

services:
    # =========================================================================
    # CACHE
    # =========================================================================

    redis:
        image: redis:7.2-alpine
        container_name: social-chat-redis
        restart: always
        command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
        volumes:
            - redis_data:/data
        ports:
            - '6379:6379'
        mem_limit: 512m
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis123}', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '3'
        networks:
            - social-chat-network

    # =========================================================================
    # SEARCH
    # =========================================================================

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        container_name: social-chat-elasticsearch
        restart: always
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - xpack.security.enrollment.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - cluster.name=social-chat-cluster
        volumes:
            - es_data:/usr/share/elasticsearch/data
        ports:
            - '9200:9200'
            - '9300:9300'
        mem_limit: 1g
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            - social-chat-network

    # =========================================================================
    # MESSAGE QUEUE
    # =========================================================================

    kafka:
        image: apache/kafka:3.7.0
        container_name: social-chat-kafka
        restart: always
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:29092,INTERNAL://kafka:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
            CLUSTER_ID: 'social-chat-kafka-cluster'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_MESSAGE_MAX_BYTES: 10485760
            KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
            KAFKA_LOG_SEGMENT_BYTES: 1073741824
            KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
        ports:
            - '29092:29092'
            - '9093:9093'
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ['CMD-SHELL', 'kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
            interval: 10s
            timeout: 10s
            retries: 5
        networks:
            - social-chat-network

    # =========================================================================
    # OBJECT STORAGE
    # =========================================================================

    minio:
        image: minio/minio:latest
        container_name: social-chat-minio
        restart: always
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - social-chat-network

    # =========================================================================
    # API GATEWAY
    # =========================================================================

    kong-migrations:
        image: kong:3.9
        container_name: social-chat-kong-migrations
        command: kong migrations bootstrap
        environment:
            KONG_DATABASE: postgres
            KONG_PG_HOST: host.docker.internal
            KONG_PG_PORT: 5432
            KONG_PG_USER: postgres
            KONG_PG_PASSWORD: postgres
            KONG_PG_DATABASE: kong
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - social-chat-network
        restart: on-failure

    kong:
        image: kong:3.9
        container_name: social-chat-kong
        restart: always
        environment:
            KONG_DATABASE: postgres
            KONG_PG_HOST: host.docker.internal
            KONG_PG_PORT: 5432
            KONG_PG_USER: postgres
            KONG_PG_PASSWORD: postgres
            KONG_PG_DATABASE: kong
            KONG_PROXY_ACCESS_LOG: /dev/stdout
            KONG_ADMIN_ACCESS_LOG: /dev/stdout
            KONG_PROXY_ERROR_LOG: /dev/stderr
            KONG_ADMIN_ERROR_LOG: /dev/stderr
            KONG_ADMIN_LISTEN: 0.0.0.0:8001
            KONG_ADMIN_GUI_URL: http://localhost:8002
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '3000:8000'   # Proxy port (client requests)
            - '3443:8443'   # Proxy SSL port
            - '8001:8001'   # Admin API port
            - '8002:8002'   # Kong Manager (Admin GUI)
        healthcheck:
            test: ['CMD', 'kong', 'health']
            interval: 10s
            timeout: 5s
            retries: 5
        depends_on:
            kong-migrations:
                condition: service_completed_successfully
        networks:
            - social-chat-network

    # =========================================================================
    # IDENTITY PROVIDER
    # =========================================================================

    keycloak:
        image: quay.io/keycloak/keycloak:25.0.2
        container_name: social-chat-keycloak
        restart: always
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
            KC_DB_USERNAME: postgres
            KC_DB_PASSWORD: postgres
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KC_FEATURES: scripts
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8080:8080'
        command:
            - start-dev
            - --spi-script-upload-enabled=true
        volumes:
            - keycloak_data:/opt/keycloak/data
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:8080/health/ready || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        networks:
            - social-chat-network

    # =========================================================================
    # DEVELOPMENT TOOLS (Optional - uncomment if needed)
    # =========================================================================

    # kafka-ui:
    #     image: provectuslabs/kafka-ui:latest
    #     container_name: social-chat-kafka-ui
    #     restart: always
    #     environment:
    #         KAFKA_CLUSTERS_0_NAME: social-chat
    #         KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    #     ports:
    #         - '8081:8080'
    #     depends_on:
    #         - kafka
    #     networks:
    #         - social-chat-network

    # redis-commander:
    #     image: rediscommander/redis-commander:latest
    #     container_name: social-chat-redis-commander
    #     restart: always
    #     environment:
    #         - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis123}
    #     ports:
    #         - '8082:8081'
    #     depends_on:
    #         - redis
    #     networks:
    #         - social-chat-network

    # kibana:
    #     image: docker.elastic.co/kibana/kibana:8.11.0
    #     container_name: social-chat-kibana
    #     restart: always
    #     environment:
    #         - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    #     ports:
    #         - '5601:5601'
    #     depends_on:
    #         - elasticsearch
    #     networks:
    #         - social-chat-network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
    pg_data:
        name: social-chat-postgres-data
    redis_data:
        name: social-chat-redis-data
    es_data:
        name: social-chat-es-data
    kafka_data:
        name: social-chat-kafka-data
    minio_data:
        name: social-chat-minio-data
    keycloak_data:
        name: social-chat-keycloak-data

# =============================================================================
# NETWORKS
# =============================================================================

networks:
    social-chat-network:
        name: social-chat-network
        driver: bridge
