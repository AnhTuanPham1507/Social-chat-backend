version: '3.9'
services:
    cache:
        image: redis:7.2.5
        restart: always
        ports:
            - 6379:6379
        command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
        environment:
            - REDIS_PASSWORD=ewqovxnzsa2438JFGSJFGbsad7dsa76asjj
        volumes:
            - cache:/data
        mem_limit: 512m
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '3'
        networks:
            - my-network

    postgres:
        image: postgres
        restart: always
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: social-chat-db
            TZ: 'Asia/Ho_Chi_Minh'
            PGTZ: 'Asia/Ho_Chi_Minh'
        volumes:
            - pg_data:/var/lib/postgresql/data
        ports:
            - 5432:5432
        networks:
            - my-network

    kafka:
        image: apache/kafka:latest
        container_name: kafka
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            CLUSTER_ID: '60erjLglS-eH86jbwVrXbg'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_NUM_PARTITIONS: 3
            # Message size limits (increase for larger messages)
            KAFKA_MESSAGE_MAX_BYTES: 10485760
            KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
            KAFKA_LOG_SEGMENT_BYTES: 1073741824
            # Connection settings
            KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
        ports:
            - '9092:9092'
            - '9093:9093'
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 5
        networks:
            - my-network

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: social-chat-backend
        depends_on:
            - postgres
            - kafka
            - cache
            - minio
        env_file:
            - env/.container.env
        ports:
            - '3000:3000'
        networks:
            - my-network

    minio:
        image: minio/minio:latest
        container_name: minio
        environment:
            - MINIO_ROOT_USER=minioadmin # Set your MinIO access key
            - MINIO_ROOT_PASSWORD=minioadmin # Set your MinIO secret key
        ports:
            - '9000:9000' # MinIO API port
            - '9001:9001' # MinIO console port
        volumes:
            - minio-data:/var/lib/minio/data # Persist data locally
        command: server /data --console-address ":9001"
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - my-network

volumes:
    cache:
    pg_data:
    kafka_data:
    minio-data:

networks:
    my-network:
        driver: bridge
